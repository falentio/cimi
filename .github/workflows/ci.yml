name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24.16.0'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Typecheck workspaces
        run: vp run -r typecheck

      - name: Test
        run: vp run -r test

      - name: API E2E
        run: vp run --filter ./apps/api test:e2e:ci

      - name: Check for leaked API E2E roots
        if: always()
        run: |
          if compgen -G '/tmp/cimi-api-e2e-*' > /tmp/cimi-api-e2e-roots.txt; then
            cat /tmp/cimi-api-e2e-roots.txt
            exit 1
          fi
