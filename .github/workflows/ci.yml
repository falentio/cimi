name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24.16.0'
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (format, lint, typecheck)
        run: vp check

      - name: Typecheck workspaces
        run: vp run -r typecheck

      - name: Test
        run: vp run -r test

      - name: Test logging benchmark contract
        run: vp test scripts/benchmark-api-logging.test.mjs

      - name: API E2E
        run: vp run --filter ./apps/api test:e2e:ci

      - name: API E2E acceptance volume
        # The task runner does not forward its caller's environment, so the window is set on the
        # command itself. This is the 27,000-event shape acceptance criteria 2 and 3 are about.
        run: CIMI_DEMO_SEED_HISTORY_DAYS=90 vp test run apps/api/e2e/demo-seed-projection.e2e.test.ts --pool forks --no-file-parallelism --maxWorkers=1

      - name: Check for leaked API E2E roots
        if: always()
        run: |
          leaked=()
          while IFS= read -r root; do
            leaked+=("$root")
          done < <(compgen -G '/tmp/cimi-api-e2e-*' || true)
          if [ ${#leaked[@]} -gt 0 ]; then
            printf '%s\n' "${leaked[@]}"
            exit 1
          fi
